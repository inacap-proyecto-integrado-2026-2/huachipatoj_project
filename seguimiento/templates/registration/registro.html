<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro - CD Huachipato</title>
<style>
  body { background-color: #0b1120; color: #f8fafc; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .login-box { background-color: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 400px; border: 1px solid #334155; text-align: center; }
  h2 { margin: 0 0 5px 0; color: white; }
  p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px; }
  .form-group { text-align: left; margin-bottom: 15px; }
  label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 5px; font-weight: bold;}
  input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; outline: none; }
  input:focus { border-color: #0284c7; }
  .btn-submit { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  .error { color: #ef4444; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); padding: 10px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 15px; text-align: left;}
  .info-box { font-size: 0.8rem; color: #38bdf8; background: rgba(2, 132, 199, 0.1); border: 1px solid rgba(2, 132, 199, 0.3); padding: 10px; border-radius: 6px; margin-bottom: 15px; text-align: left; line-height: 1.4;}
</style>
</head>
<body>

  <div class="login-box">
    <h2>Registro CDH</h2>
    <p>Validación de Deportista Oficial</p>

    {% if error %} <div class="error">{{ error }}</div> {% endif %}

    <div class="info-box">
      ℹ️ Si eres alumno, ingresa el RUT con el que te registró el profesor. Tu contraseña inicial por defecto será: <b>huachipato2026</b>
    </div>

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>RUT del Deportista</label>
        <input type="text" name="rut" required autofocus placeholder="Ej: 12345678-9">
      </div>
      
      <!-- CAMPO SECRETO DE PROFESOR -->
      <div class="form-group" style="margin-top: 20px; border-top: 1px dashed #334155; padding-top: 15px;">
        <label style="color: #f59e0b;">Código de Profesor (Opcional)</label>
        <input type="password" name="codigo_secreto" placeholder="Solo si eres el profesor titular">
      </div>

      <button type="submit" class="btn-submit">Validar y Registrarse</button>
      <div style="margin-top: 15px;">
          <a href="{% url 'login' %}" style="color: #0284c7; font-size: 0.85rem; text-decoration: none;">¿Ya tienes cuenta? Inicia Sesión</a>
      </div>
    </form>
  </div>

</body>
</html>
