<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Agregar Alumno - CD Huachipato</title>
<style>
  body { background-color: #0b1120; color: #f8fafc; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .form-container { background-color: #1e293b; padding: 40px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 500px; }
  h2 { margin-top: 0; color: #0284c7; display: flex; align-items: center; gap: 10px; }
  
  .form-group { margin-bottom: 20px; }
  label { display: block; font-size: 0.9rem; color: #94a3b8; margin-bottom: 8px; font-weight: 600;}
  input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; outline: none; font-size: 1rem; }
  input:focus, select:focus { border-color: #0284c7; }
  
  .btn-group { display: flex; gap: 15px; margin-top: 30px; }
  .btn-save { flex: 1; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
  .btn-save:hover { background: #0369a1; }
  .btn-cancel { flex: 1; padding: 12px; background: transparent; color: #94a3b8; border: 1px solid #334155; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; transition: 0.2s; }
  .btn-cancel:hover { background: #334155; color: white; }
</style>
</head>
<body>

  <div class="form-container">
    <h2>
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      Nuevo Deportista
    </h2>
    <p style="color: #94a3b8; margin-bottom: 30px;">Ingresa los datos del nuevo alumno al sistema.</p>

    <form method="POST">
      {% csrf_token %}
      
      <div class="form-group"><label>RUT</label>{{ form.rut }}</div>
      <div class="form-group"><label>Nombre Completo</label>{{ form.nombre_completo }}</div>
      
      <div style="display: flex; gap: 15px;">
        <div class="form-group" style="flex: 1;"><label>Categoría</label>{{ form.categoria }}</div>
        <div class="form-group" style="flex: 1;"><label>Fecha de Nacimiento</label>{{ form.fecha_nacimiento }}</div>
      </div>

      <div class="form-group"><label>Contacto de Emergencia</label>{{ form.contacto_emergencia }}</div>

      <div class="btn-group">
        <a href="{% url 'panel_entrenador' %}" class="btn-cancel">Cancelar</a>
        <button type="submit" class="btn-save">Guardar Alumno</button>
      </div>
    </form>
  </div>

</body>
</html>
